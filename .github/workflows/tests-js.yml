name: 'JS Tests'
on:
  pull_request:
    paths:
      - 'ui/js/**'
      - 'package.json'
      - 'webpack.*.js'
      - 'jest-setup-wordpress-globals.js'
      - 'jest.config.json'
      - '.github/workflows/tests-js.yml'
jobs:
  test:
    strategy:
      matrix:
        suite: [ 'jest' ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Setup Node.js using nvmrc file
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v3
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci --force --legacy-peer-deps
      # ------------------------------------------------------------------------------
      # @wordpress/scripts (via read-pkg / normalize-package-data) requires a valid semver
      # "version" in package.json. Pods ships a 4-part hotfix version (e.g. 3.3.9.1), which is not
      # valid semver and makes jest throw before it starts. Strip the 4th segment here (after
      # npm ci, so the committed package-lock.json still matches during install), preserving any
      # pre-release/build suffix (e.g. 3.3.9.1-a-1 -> 3.3.9-a-1).
      - name: Normalize package.json version to valid semver
        run: |
          perl -i -pe 's/"version":\s*"(\d+\.\d+\.\d+)\.\d+/"version": "$1/' package.json
          echo "Using version: $(node -p "require('./package.json').version")"
      - name: Run JS test suite
        run: npm run ${{ matrix.suite }}
