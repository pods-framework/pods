name: Deploy to WordPress.org
permissions:
  id-token: write
  attestations: write
on:
  release:
    types: [published]
jobs:
  check-latest:
    name: Check if latest release
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.check.outputs.is-latest }}
    steps:
      - name: Query GitHub for isLatest
        id: check
        run: |
          IS_LATEST=$(gh release view "${{ github.event.release.tag_name }}" \
            --json isLatest --jq '.isLatest')
          echo "is-latest=$IS_LATEST" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  tag:
    name: New tag
    needs: check-latest
    if: needs.check-latest.outputs.is-latest == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Check the version number from package.json
      shell: bash
      run: echo "PLUGIN_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@2.3.0
      id: deploy
      with:
        generate-zip: true
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        VERSION: ${{ env.PLUGIN_VERSION }}
    - name: Generate build provenance attestation
      uses: johnbillion/action-wordpress-plugin-attestation@0.7.3
      with:
        zip-path: ${{ steps.deploy.outputs.zip-path }}
    - name: Send message to Slack API
      uses: archive/github-actions-slack@v2.7.0
      id: notify
      with:
        slack-bot-user-oauth-access-token: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
        slack-channel: C02SWND14
        slack-text: The ${{ github.event.repository.name }} tag has been deployed to svn.wordpress.org 🎉
